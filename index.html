<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather app</title>
  <link rel="stylesheet" href="main.css" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>

  <div class="app-wrap">
    <h1>
      <span class="material-symbols-outlined">
        thunderstorm
      </span>

      Weather APP

      <span class="material-symbols-outlined">
        sunny
      </span>
      <section class="location">
        <div class="date"></div>
      </section>
    </h1>

    <header>

      <input type="text" autocomplete="off" class="search-box" placeholder="Search for a city" />
    </header>
    <main>
      <section class="location">
        <div class="city"></div>
      </section>
      <div class="current">
        <div class="temp"><span></span></div>
        <h2>
          <div class="feelslike"></div>
        </h2>
        <br>
        <br>
        <div class="weather"></div>
        <div class="hi-low"></div>
        <img src="totoro.gif" alt="Totoro">
      </div>
    </main>
  </div>


  <script src="main.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap');
  </style>
</body>
<section class="footer-section">

  <div class="copyright">
    <p class="copyright-e2101321">Copyright &copy; 2023 e2101321</p>
    <br>
    <p class="copyright-vamk">VAMK</p>
  </div>


  <div class="creator-container">
    <p class="copyright-creator">Mika Nevalampi</p>
  </div>


</section>

</html>
